# Web Service gratuito de Render con PostgreSQL externo.
services:
  - type: web
    name: patea-la-puerta
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    # El chequeo TCP predeterminado permite que Neon suspenda el cómputo en reposo.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: ROOM_TTL_DAYS
        value: '7'
      - key: DATABASE_URL
        sync: false
